# Full CampusOne stack: PostgreSQL, Redis, the NestJS API and the Next.js web app.
#   cp .env.docker.example .env      (then set JWT_SECRET)
#   docker compose up --build
#   docker compose run --rm api npm run db:seed     (demo data, first time only)
# Open http://localhost:3000

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: campusone
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campusone}
      POSTGRES_DB: campusone
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusone -d campusone"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://campusone:${POSTGRES_PASSWORD:-campusone}@postgres:5432/campusone
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (32+ random characters, e.g. openssl rand -hex 32)}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    volumes:
      - uploads:/app/uploads
    ports:
      - "4000:4000"

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:4000/api}
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:
  uploads:
